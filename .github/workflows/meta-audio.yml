name: Meta · buscar música de Instagram

on:
  push:
    paths: ['publicador/audio.mjs', '.github/workflows/meta-audio.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_ID: '17841430450985904'
          PAGE_ID: '1371169526080229'
        run: node publicador/audio.mjs
      - run: |
          git config user.name "bahiga-publicador"; git config user.email "info@bahiga.es"
          git add publicador/audio.json; git diff --cached --quiet && exit 0
          git commit -m "Búsqueda de música de Instagram"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q && break; sleep 5; done
