name: Referencia temporal
on:
  push:
    paths: ['tmp-ref/ver.mjs', '.github/workflows/tmp-ref.yml']
permissions:
  contents: write
jobs:
  ver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tmp-ref/ver.mjs
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_ID: '17841430450985904'
      - run: |
          git config user.name "bahiga-publicador"; git config user.email "info@bahiga.es"
          git add tmp-ref; git commit -m "Referencia temporal"; for i in 1 2 3; do git pull --rebase -q origin main && git push -q && break; sleep 5; done
