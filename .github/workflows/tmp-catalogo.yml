name: tmp · prueba catálogo
on:
  push:
    paths: ['.github/workflows/tmp-catalogo.yml']
permissions:
  contents: write
jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Leer publicaciones
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_ID: '17841430450985904'
          PAGE_ID: '1371169526080229'
        run: |
          cat > /tmp/p.mjs <<'JS'
          import { writeFileSync } from 'node:fs';
          const T = process.env.META_TOKEN, G = 'https://graph.facebook.com/v24.0';
          const get = async (u) => { const r = await fetch(u + (u.includes('?') ? '&' : '?') + 'access_token=' + T); return r.json(); };
          const out = {};
          const ig = await get(`${G}/${process.env.IG_ID}/media?fields=id,caption,media_type,media_product_type,media_url,thumbnail_url,permalink,timestamp,children{media_type,media_url}&limit=12`);
          if (ig.error) out.instagram = { error: ig.error.message };
          else {
            const m = ig.data || [];
            let descarga = null;
            const foto = m.find((x) => x.media_url && x.media_type !== 'VIDEO') || m.find((x) => x.thumbnail_url);
            if (foto) { const r = await fetch(foto.media_type === 'VIDEO' ? foto.thumbnail_url : foto.media_url); descarga = { estado: r.status, tipo: r.headers.get('content-type'), bytes: (await r.arrayBuffer()).byteLength }; }
            out.instagram = { leidas: m.length, hay_mas: !!ig.paging?.next, descarga,
              piezas: m.map((x) => ({ tipo: x.media_type, producto: x.media_product_type, fecha: x.timestamp, con_media_url: !!x.media_url, con_miniatura: !!x.thumbnail_url, hijos: x.children?.data?.length || 0, hijos_con_url: (x.children?.data || []).filter((h) => h.media_url).length, texto: (x.caption || '').slice(0, 50), enlace: x.permalink, host: x.media_url ? new URL(x.media_url).host : null, caduca: x.media_url ? /[?&](oe|_nc_oe)=/.test(x.media_url) : null })) };
          }
          const fb = await get(`${G}/${process.env.PAGE_ID}/published_posts?fields=id,message,full_picture,permalink_url,created_time,attachments{media_type,subattachments.limit(10){media}}&limit=8`);
          out.facebook = fb.error ? { error: fb.error.message } : { leidas: (fb.data || []).length, piezas: (fb.data || []).map((x) => ({ fecha: x.created_time, con_imagen: !!x.full_picture, tipo: x.attachments?.data?.[0]?.media_type || null, varias: x.attachments?.data?.[0]?.subattachments?.data?.length || 0, texto: (x.message || '').slice(0, 50), enlace: x.permalink_url })) };
          writeFileSync('tmp-catalogo.json', JSON.stringify(out, null, 1));
          JS
          node /tmp/p.mjs
      - name: Guardar
        run: |
          git config user.name "bahiga-publicador"
          git config user.email "info@bahiga.es"
          git add tmp-catalogo.json
          git commit -m "tmp: resultado prueba catálogo" && git pull --rebase origin main && git push
